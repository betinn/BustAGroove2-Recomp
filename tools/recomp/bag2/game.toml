# game.toml — Bust A Groove 2 (USA) para o PSXRecomp (RetroPortingToolKit/psxrecomp).
# Esquema: C:\tools\psxrecomp\docs\config_schema.md
# Caminhos relativos resolvem a partir da "raiz do projeto" = esta pasta
# (o loader sobe diretórios até achar CMakeLists.txt/.gitignore/.git).
#
# Fatos do cabeçalho PS-X EXE (lidos de extracted/disc/SLUS_011.59):
#   pc0 = 0x80038270, t_addr = 0x80010000, t_size = 0x4E800, sp = 0x801FFFF0
#   SYSTEM.CNF: BOOT = cdrom:\SLUS_011.59;1  TCB=4 EVENT=16 STACK=801FFF00
#
# Overlays: o jogo NÃO usa o loader do BIOS. Ele mesmo carrega blocos DBI_
# de dentro de BUST2.BIN, descomprime com uma rotina BPE em 0x80035DC4 e
# instala em 0x8008F6C0 (função de instalação em 0x8001F7E0). O PSXRecomp
# trata isso em runtime: captura o código que aparece em RAM, cai no
# interpretador MIPS e compila via gcc/tcc, guardando em overlay_captures.json
# (ver docs/EXECUTION_MODEL.md, docs/AOT_SHARDING.md, docs/COMPILING_OVERLAYS.md).

[game]
name         = "Bust A Groove 2"
id           = "SLUS-01159"
players      = 2
exe          = "../../../extracted/disc/SLUS_011.59"
disc         = "C:/Users/sem-m/OneDrive/Documentos/My Games/Bust a groove 2/Bust A Groove 2 (USA).cue"
load_address = "0x80010000"
entry_pc     = "0x80038270"
text_size    = "0x0004F000"   # header diz 0x4E800; psxrecomp-toml arredonda para a página de 4 KiB
stack_base   = "0x801FFFF0"

[recompiler]
# seeds/functions.txt: alvos de JAL extraídos pelo psxrecomp-toml + endereços
# conhecidos (BPE 0x80035DC4, instalador de overlay 0x8001F7E0).
seeds       = "seeds/functions.txt"
bios_config = "C:/tools/psxrecomp/bios/OpenBIOS.toml"   # perfil de BIOS (modelo de endereços); OpenBIOS é o que roda
out_dir   = "generated"
strict    = true
discovery = "whole-image"
# Hook do remake do HEAT (src/bag2_heat.c): entrada de FUN_80029D4C, que desenha a árvore de ossos de
# um personagem. Inerte sem o plugin bag2.heat_remake ativo (notes/remake-visual.md §no jogo).
mod_function_entry_funcs = ["0x80029D4C"]

[runtime]
window_title = "Bust A Groove 2 Recompiled"
memcard_dir  = "saves"
disc_speed   = "2x"
bios_hle     = false      # LLE do OpenBIOS (mais fiel); true = pula a animação de boot
overlay_cache = true
overlay_backend = "auto"

[video]
renderer          = "opengl"   # "software" é o fallback/referência (e o que a web usa)
# Resolução interna: o PS1 desenha a 320x240; "1080p" renderiza a 5x (1200 linhas) e resolve para a
# janela. Outros valores: native | 720p | 1080p | 1440p | 4k | display (acompanha o monitor).
internal_resolution        = "4k"           # 9x (2160 linhas) resolvido para 1080p = supersampling 2x por eixo
resolution_reference_lines = 240
window_width               = 1920          # janela inicial (F11 = tela cheia)
vsync                      = "on"
render_thread              = true          # GL numa thread própria: stalls do driver não travam o jogo. O remake do HEAT
                                           # precisa do patch local tools/recomp/patches/psxrecomp-texture-bank-render-thread.patch
                                           # (sem ele cada troca de banco de textura sincroniza as threads: ~30-40 fps)
# Geometria/texturas: PGXP corrige o "tremor" dos vértices e a distorção afim das texturas do PS1.
geometry_correction   = true
perspective_texturing = true
pgxp_depth_buffer     = false
texture_filtering = "xbr"      # nearest (original) | bilinear | xbr (bordas diagonais suavizadas, texels nítidos)
dithering         = "off"      # sem o padrão 4x4 do PS1 (cor de 24 bits)
antialiasing_mode = "off"      # o supersampling 9x->1080p já suaviza; FXAA só borraria
aspect_ratio      = "16:9"     # campo de visão mais largo (GTE projeta mais mundo nas laterais), sem esticar;
                               # HUD/sprites 2D ficam em 4:3 centralizados ([widescreen] abaixo). "4:3" = original.
dynamic_resolution = false

# Widescreen "native-wide": o runtime alarga a área de desenho (320 -> 426 px a 16:9) e o GTE
# projeta mais mundo nas laterais; nada é esticado. Quadros 2D (menus, FMV, BIOS) ficam 4:3.
[widescreen]
gte_game_mode   = true        # classifica como jogo qualquer quadro com projeção GTE (jogo 3D);
                              # sem isso o runtime só reconhece "jogo" por sprite_tag_funcs e alterna 16:9/4:3
hud_sprt_squash = true        # HUD/sprites 2D em proporção original
auto_ui_squash  = true
auto_ui_anchor  = "edges"     # HUD de canto vai para os cantos da tela larga
auto_ui_size    = "original"
clear_reveal    = true        # limpa as faixas laterais em trocas de cena (sem lixo de VRAM)

# Presets selecionáveis por PSX_QUALITY ou settings.toml (ver docs/QUALITY_PRESETS.md)
[quality.ultra]
[quality.high]
texture_filtering = "bilinear"
[quality.medium]
texture_filtering = "nearest"
antialiasing = false
[quality.low]
texture_filtering = "nearest"
antialiasing = false
render_thread = false

[controller]
default_analog = false
deadzone       = 12000

# Regiões para a ferramenta de auditoria (tools/audit_config.py):
[audit]
[[audit.regions]]
name       = "Main executable text"
rom_start  = "0x800"
rom_end    = "0x4F000"
vaddr_base = "0x80010000"

[audit.normalize]
kseg_mask = "0x1FFFFFFF"
